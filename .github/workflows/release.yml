name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # Releases are published from GitHub, where the archives are downloaded from.
    if: ${{ github.server_url == 'https://github.com' }}
    permissions:
      contents: write
    # A main commit of integrations, for description.json, until its release; then the
    # release tag.
    uses: qoryai/integrations/.github/workflows/release.yml@5f92b11673052874cd1e2f9fbf246a230d50dd16
    with:
      program: qory-github
