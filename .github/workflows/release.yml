name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # Releases are published from GitHub, where the archives are downloaded from.
    if: ${{ github.server_url == 'https://github.com' }}
    permissions:
      contents: write
    uses: qoryai/integrations/.github/workflows/release.yml@v0.2.0
    with:
      program: qory-github
